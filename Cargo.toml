[package]
name = "shuttle-tile-sim"
version = "0.1.0"
edition = "2021"
authors = ["Aerospace Manufacturing Simulation Team"]
description = "Space Shuttle thermal protection tile manufacturing, identification, and testing simulation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_approx_eq = "1.1"

[[bin]]
name = "shuttle-tile-sim"
path = "src/main.rs"
